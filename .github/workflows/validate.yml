name: Validate repository

on:
  push:
    paths:
      - 'plugins/plugins.json'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'pluginmaster.json'
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate configuration
        run: python scripts/generate_repo.py --validate-config
      - name: Test generation and failure handling
        run: python -m unittest discover -s tests -v
      - name: Validate feed JSON
        run: python -m json.tool pluginmaster.json > /dev/null
