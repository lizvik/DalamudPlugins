name: Update plugin repository

on:
  workflow_dispatch:
    inputs:
      allow_empty:
        description: 'Allow intentionally removing every plugin from the feed'
        type: boolean
        default: false
  schedule:
    - cron: '0 * * * *'
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'scripts/**'
      - '.github/workflows/update-repo.yml'

permissions:
  contents: write

concurrency:
  group: update-plugin-repository
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test generator
        run: python -m unittest discover -s tests -v
      - name: Generate stable feed
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ALLOW_EMPTY: ${{ inputs.allow_empty }}
        shell: bash
        run: |
          args=()
          if [[ "$ALLOW_EMPTY" == "true" ]]; then
            args+=(--allow-empty)
          fi
          python scripts/generate_repo.py "${args[@]}"
      - name: Commit changed feed
        shell: bash
        run: |
          if git diff --quiet -- pluginmaster.json; then
            echo 'No plugin updates.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- pluginmaster.json
          git commit -m 'chore: update plugin repository'
          git push
